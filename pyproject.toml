[project]
name = "product-card-assistant"
version = "0.1.0"
description = "Grounded B2B product card drafts with OpenAI"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "openai>=2,<3", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "python-dotenv>=1,<2"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "mutmut>=3.8.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mutmut]
source_paths = ["product_cards/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["examples/"]
process_isolation = "forkserver"
on_dependency_change = "rerun"
cache_invalidation_files = ["tests/**/*.py"]
